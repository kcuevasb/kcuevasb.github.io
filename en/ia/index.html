<template id="tpl-experiencia">
  <p class="user-q">What are you working on right now?</p>
  <div class="a-body">
    <article class="role-card">
      <div class="role-card-head"><strong>Sopra Steria</strong><span>· client: Leroy Merlin</span><time>Sep 2025 — present</time></div>
      <p>Analysis and development of backend microservices with Spring Boot for the finance area's product family at
      Leroy Merlin Spain. Queries against relational (PostgreSQL) and non-relational (MongoDB) databases,
      plus development of the inter-service communication and data aggregation services.</p>
      <p>Support on the project's architecture design, including microservices built from scratch with
      hexagonal architecture. Deployment on GKE/Kubernetes, code quality with Sonar, unit and integration
      tests with Mockito/JUnit, and asynchronous events with Kafka Avro.</p>
      <div class="chip-row small">
        <span class="chip">Java 17+</span><span class="chip">Spring Boot 4</span><span class="chip">API REST</span>
        <span class="chip">Kafka Avro</span><span class="chip">PostgreSQL</span><span class="chip">MongoDB</span>
        <span class="chip">GKE/Kubernetes</span><span class="chip">Artifactory</span><span class="chip">Hexagonal arch.</span>
      </div>
    
      <div class="role-why">
        <p class="why-title">Three decisions</p>
        <ul>
        <li><b>Idempotency</b> · Kafka redeliveries are caught with an expression index in PostgreSQL rather than a plain UNIQUE constraint: it tells a real duplicate apart without locking the table or slowing writes down.</li>
        <li><b>Reprocessing apart</b> · error-recovery logic lives in its own service instead of inside the main flow, so the happy path does not carry it and each one deploys and scales on its own.</li>
        <li><b>Scaling</b> · adding replicas on CPU was useless with fewer Kafka partitions than replicas: autoscaling has to track the topic's real parallelism, not just a resource metric.</li>
        </ul>
      </div>
    </article>

    <p class="prose-note">Each earlier stage has its own chapter, styled after the tool I used back then:
    <strong>NTT Data</strong> (2017–2022) in Eclipse and <strong>Knowmad Mood</strong> (2022–2025) in
    IntelliJ. They are on the home page.</p>
  </div>
</template>
