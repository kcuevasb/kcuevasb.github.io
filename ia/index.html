    <button class="new-chat" id="new-chat-btn">+ Nueva pregunta</button>

    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <form class="composer" id="composer">
      <input id="composer-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Pregúntale algo a este CV… (prueba «ayuda»)" aria-label="Escribe una pregunta">
      <button type="submit" class="send-btn" aria-label="Enviar">↑</button>
    </form>

<!-- THREAD CONTENT TEMPLATES -->
<template id="tpl-sobre-mi">
  <p class="user-q">¿Quién eres y a qué te dedicas?</p>
  <div class="a-body">
    <p>Soy Kepa Cuevas Barrasa, ingeniero de software desde 2017. Construyo backend Java/Spring Boot para
    sectores donde un fallo no es una anécdota: seguros, ecommerce, sanidad.</p>
    <p>Siete años entre análisis, diseño y desarrollo de microservicios, con foco en integridad de datos,
    mensajería asíncrona y despliegues que no dependen de que yo esté delante. Perfil resolutivo: prefiero
    encontrar la causa raíz antes que un parche que aguante hasta el viernes.</p>
    <p>Este capítulo cubre mi etapa actual, en <strong>Sopra Steria</strong> — y está montado como un chat
    porque es justo así como trabajo hoy: con la IA de copiloto al lado, todo el día. Los capítulos anteriores
    llevan la estética de la herramienta de cada época.</p>
    <div class="chip-row">
      <span class="chip">Español · C2</span>
      <span class="chip">Euskera · C1</span>
      <span class="chip">Inglés · B2</span>
    </div>
  </div>
</template>

<template id="tpl-experiencia">
  <p class="user-q">¿En qué estás trabajando ahora mismo?</p>
  <div class="a-body">
    <article class="role-card">
      <div class="role-card-head"><strong>Sopra Steria</strong><span>· cliente: Leroy Merlin</span><time>sep 2025 — actualidad</time></div>
      <p>Análisis y desarrollo de microservicios backend con Spring Boot para la familia de productos HF3P en
      Leroy Merlin España. Consultas a base de datos relacional (PostgreSQL) y no relacional (MongoDB), y
      desarrollo de los servicios de comunicación entre microservicios y agregación de datos.</p>
      <p>Soporte en el diseño de arquitectura del proyecto, incluyendo microservicios desde cero con
      arquitectura hexagonal. Despliegue en GKE/Kubernetes, calidad de código con Sonar, tests unitarios y de
      integración con Mockito/JUnit, y eventos asíncronos con Kafka Avro.</p>
      <div class="chip-row small">
        <span class="chip">Java 17+</span><span class="chip">Spring Boot 4</span><span class="chip">API REST</span>
        <span class="chip">Kafka Avro</span><span class="chip">PostgreSQL</span><span class="chip">MongoDB</span>
        <span class="chip">GKE/Kubernetes</span><span class="chip">Artifactory</span><span class="chip">Arq. Hexagonal</span>
      </div>
    </article>

    <p class="prose-note">Las etapas anteriores tienen cada una su propio capítulo, con la estética de la
    herramienta que usaba entonces: <strong>NTT Data</strong> (2017–2022) en Eclipse y
    <strong>Knowmad Mood</strong> (2022–2025) en IntelliJ. Vuelve al selector para verlas.</p>
  </div>
</template>
