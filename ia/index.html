<template id="tpl-sobre-mi">
  <p class="user-q">¿Quién eres y a qué te dedicas?</p>
  <div class="a-body">
    <p>Soy Kepa Cuevas Barrasa, ingeniero de software: en el sector desde 2017 y con siete años
    programando. Construyo backend Java/Spring Boot para sectores donde un fallo no es una
    anécdota: seguros, ecommerce, sanidad.</p>
    <p>Análisis, diseño y desarrollo de microservicios, con foco en integridad de datos,
    mensajería asíncrona y despliegues que no dependen de que yo esté delante. Perfil resolutivo: prefiero
    encontrar la causa raíz antes que un parche que aguante hasta el viernes.</p>
    <p>Este capítulo cubre mi etapa actual, en <strong>Sopra Steria</strong> — y está montado como un chat
    porque es justo así como trabajo hoy: con la IA de copiloto al lado, todo el día. Los capítulos anteriores
    llevan la estética de la herramienta de cada época.</p>
    <div class="chip-row">
      <span class="chip">Español · C2</span>
      <span class="chip">Euskera · C1</span>
      <span class="chip">Inglés · B2</span>
    </div>
  </div>

      <p>Análisis y desarrollo de microservicios backend con Spring Boot para la familia de productos HF3P en
      Leroy Merlin España. Consultas a base de datos relacional (PostgreSQL) y no relacional (MongoDB), y
      desarrollo de los servicios de comunicación entre microservicios y agregación de datos.</p>
      <p>Soporte en el diseño de arquitectura del proyecto, incluyendo microservicios desde cero con
      arquitectura hexagonal. Despliegue en GKE/Kubernetes, calidad de código con Sonar, tests unitarios y de
      integración con Mockito/JUnit, y eventos asíncronos con Kafka Avro.</p>
      <div class="chip-row small">
