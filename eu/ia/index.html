  <div class="a-body">
    <p>Kepa Cuevas Barrasa naiz, software ingeniaria: sektorean 2017tik eta zazpi urte
    programatzen. Java/Spring Boot backenda eraikitzen dut akats bat anekdota bat ez den
    sektoreetarako: aseguruak, merkataritza elektronikoa, osasungintza.</p>
    <p>Mikrozerbitzuen analisia, diseinua eta garapena, datuen osotasunean, mezularitza
    asinkronoan eta ni aurrean egotearen mendekoak ez diren hedapenetan jarrita begirada. Arazoak
    konpontzen ditut: nahiago dut sustraiko arrazoia aurkitu, ostirala arte eusten duen adabaki bat baino.</p>
    <p>Kapitulu honek nire uneko etapa hartzen du, <strong>Sopra Sterian</strong> — eta txat gisa dago
    eraikita, gaur horrela lan egiten dudalako: AA kopilotu gisa ondoan, egun osoan. Aurreko kapituluek
    garai bakoitzeko tresnaren estetika daramate.</p>
